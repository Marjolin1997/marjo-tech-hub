server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Network Diagnostics sends a bounded upload payload (currently 4 MB;
    # backend rejects payloads above 10 MB). Keep the proxy limit aligned
    # with that application-level cap without increasing it globally.
    location = /api/network-test/upload {
        client_max_body_size 10m;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
