services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: marjo-tech-hub-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - marjo-tech-hub

  nginx:
    image: nginx:1.27-alpine
    container_name: marjo-tech-hub-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - marjo-tech-hub

  mysql:
    image: mysql:8.0
    container_name: marjo-tech-hub-mysql
    environment:
      MYSQL_DATABASE: marjo_tech_hub
      MYSQL_USER: marjo
      MYSQL_PASSWORD: marjo_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - marjo-tech-hub

networks:
  marjo-tech-hub:
    driver: bridge

volumes:
  mysql_data:
